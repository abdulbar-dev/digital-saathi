function tr(src){const m=src.match(/^(\s*)([\s\S]*?)(\s*)$/),core=m[2];if(!core)return src;let o=D[core];if(o===undefined)for(const[r,f]of PAT){const x=core.match(r);if(x){o=f(x);break}}return m[1]+dig(o===undefined?core:o)+m[3]}

function AuthPage({mode}){const{auth,go}=useContext(C);const[fullName,setFullName]=useState(''),[email,setEmail]=useState(''),[password,setPassword]=useState(''),[confirm,setConfirm]=useState(''),[error,setError]=useState('');const signup=mode==='signup';const submit=e=>{e.preventDefault();setError('');if(signup&&fullName.trim().length<2)return setError('Please enter your full name.');if(!email.trim())return setError('Please enter your email address.');if(password.length<6)return setError('Password must be at least 6 characters.');if(signup&&password!==confirm)return setError('Passwords do not match.');signup?auth.signUp(fullName,email,password):auth.signIn(email,password)};return html`<div className="auth-page min-h-screen flex items-center justify-center px-4 py-8 sm:px-6"><div className="auth-content w-full max-w-md"><div className="text-center mb-8"><button className="text-3xl font-bold tracking-tight" onClick=${()=>go('welcome')}>Digital Saathi</button><p className="mt-2 text-lg text-[#0B2A7A]">Learn digital skills safely, one step at a time.</p></div><div className="auth-card bg-white border-[3px] border-[#0B2A7A] rounded-[2rem] p-5 sm:p-8 shadow-[8px_8px_0_#0B2A7A]"><div className="mb-6"><h1 className="text-3xl sm:text-4xl font-bold">${signup?'Create your account':'Welcome back'}</h1><p className="mt-2 text-base sm:text-lg">${signup?'Create an account to sync your progress.':'Log in to continue learning.'}</p></div>${window.DigitalSaathiSupabase?.configured?html`<form className="space-y-4" onSubmit=${submit} noValidate>${signup&&html`<div><label className="block font-bold mb-1" htmlFor="auth-full-name">Full name</label><input id="auth-full-name" type="text" autoComplete="name" required value=${fullName} onChange=${e=>setFullName(e.target.value)} className="w-full min-h-[50px] px-4 text-lg rounded-xl border-2 border-[#0B2A7A] focus:outline-none focus:ring-4 focus:ring-[#C9D7FF]"/></div>`}<div><label className="block font-bold mb-1" htmlFor="auth-email">Email</ const APP_ROUTES=new Set(['welcome','login','signup','home','lessons','practice','safety','progress','support','settings']);
const normalizeRoute=value=>{let route=String(value||'').replace(/^#/,'').split('?')[0].replace(/^\/+|\/+$/g,'').trim().toLowerCase();if(!route)return'welcome';if(route==='dashboard')return'home';const alias=route.match(/^(?:course|tutorial|lesson)[-_\/](.+)$/);if(alias)route='lesson-'+alias[1];if(L.some(l=>l.id===route))route='lesson-'+route;if(route.startsWith('lesson-'))return L.some(l=>l.id===route.slice(7))?route:'home';return APP_ROUTES.has(route)?route:'home'};
class ErrorBoundary extends React.Component{constructor(p){super(p);this.state={error:null}}static getDerivedStateFromError(error){return{error}}componentDidCatch(error,info){console.error('[Digital Saathi] Page render failed',error,info)}render(){if(this.state.error)return html`<div className="min-h-screen flex items-center justify-center p-6"><${Card} c="max-w-2xl space-y-4"><h1 className="text-3xl font-bold">This page could not load</h1><p>Something went wrong while opening this part of Digital Saathi.</p><${Btn} onClick=${()=>{this.setState({error:null});location.hash='home';location.reload()}}>Return to Dashboard</${Btn}></${Card}></div>`;return this.props.children}}
function App(){
const[st,setSt]=useLS('ww_state',{done:{},step:{},scores:{},hist:[],plan:{},notes:[],q:[],rem:''});
const[set,setSet]=useLS('ww_set',{lang:'en',fs:18,hc:false,voice:false});
const[auth,setAuth]=useState({user:null,profileName:'',busy:false,error:'',message:''});
const[route,setRoute]=useState(()=>normalizeRoute(location.hash));
useEffect(()=>{const client=window.DigitalSaathiSupabase?.client || null;if(!client)return;let active=true;client.auth.getSession().then(({data,error})=>{if(!active)return;if(error){setAuth(a=>({...a,error:error.message}));return}const user=data.session?.user||null;setAuth(a=>({...a,user,profileName:user?.user_metadata?.full_name||''}));if(user&&normalizeRoute(location.hash)!=='home')go('home')}).catch(error=>{if(active)setAuth(a=>({...a,error:error?.message||'Unable to restore your session.'}))});const{data:{subscription}}=client.auth.onAuthStateChange((event,session)=>{const user=session?.user||null;setAuth(a=>({...a,user,profileName:user?.user_metadata?.full_name||a.profileName,busy:false}));if(event==='SIGNED_IN')go('home')});return()=>{active=false;subscription?.unsubscribe?.()}},[]);
useEffect(()=>{if(!auth.user)return;let active=true;DigitalSaathiData.getUserData(auth.user.id).then(remote=>{if(!active||!remote)return;const merged=DigitalSaathiData.stateFromRemote(remote,st,set);if(merged){setSt(merged.state);setSet(merged.settings)}const profileName=remote.profile?.full_name||auth.user.user_metadata?.full_name||'';if(profileName)setAuth(a=>({...a,profileName}));if(!remote.profile?.full_name&&auth.user.user_metadata?.full_name)DigitalSaathiData.saveProfile(auth.user.id,set,{fullName:auth.user.user_metadata.full_name})}).catch(error=>{if(active)setAuth(a=>({...a,error:error?.message||'Unable to load your saved progress.'}))});return()=>{active=false}},[auth.user&&auth.user.id]);
const signIn=async(email,password)=>{const client=window.DigitalSaathiSupabase?.client || null;if(!client){setAuth(a=>({...a,error:'Account service is not configured yet.'}));return}setAuth(a=>({...a,busy:true,error:'',message:''}));const{data,error}=await client.auth.signInWithPassword({email,password});if(error){setAuth(a=>({...a,busy:false,error:error.message}));return}const name=data.user?.user_metadata?.full_name||'';setAuth(a=>({...a,busy:false,profileName:name}));go('home')};
const signUp=async(fullName,email,password)=>{const client=window.DigitalSaathiSupabase?.client || null;if(!client){setAuth(a=>({...a,error:'Account service is not configured yet.'}));return}setAuth(a=>({...a,busy:true,error:'',message:''}));const{data,error}=await client.auth.signUp({email,password,options:{data:{full_name:fullName.trim()},emailRedirectTo:location.origin+location.pathname+'#home'}});if(error){setAuth(a=>({...a,busy:false,error:error.message}));return}if(data.session&&data.user){await DigitalSaathiData.saveProfile(data.user.id,set,{fullName});setAuth(a=>({...a,busy:false,profileName:fullName.trim()}));go('home')}else setAuth(a=>({...a,busy:false,message:'Check your email to confirm your account, then log in.'}))};
const signOut=async()=>{const client=window.DigitalSaathiSupabase?.client || null;if(client){const{error}=await client.auth.signOut();if(error){setAuth(a=>({...a,busy:false,error:error.message}));return}}setAuth(a=>({...a,user:null,profileName:'',busy:false,error:'',message:''}));go('login')};
useEffect(()=>{const h=()=>setRoute(normalizeRoute(location.hash));addEventListener('hashchange',h);return()=>removeEventListener('hashchange',h)},[]);
useEffect(()=>{document.documentElement.style.fontSize=set.fs+'px';document.documentElement.style.setProperty('--fs',set.fs+'px');document.documentElement.classList.toggle('hc',!!set.hc);document.documentElement.lang=set.lang;document.documentElement.dir=set.lang==='ur'?'rtl':'ltr';document.title=set.lang==='ur'?'ڈیجیٹل ساتھی':'Digital Saathi – Learn at Your Pace'},[set]);

const firstR=useRef(true);
useEffect(()=>{if(firstR.current){firstR.current=false;return}if(set.voice&&set.lang==='en'){const name=NAV.find(([k])=>k===route.split('-')[0])?.[2];if(name)speak('You are on the '+name+' page')}},[route]);
const go=r=>{const next=normalizeRoute(r);if(location.hash.slice(1)!==next){location.hash=next}else setRoute(next);window.scrollTo(0,0)};
const up=(k,v)=>{setSt(s=>({...s,[k]:v}));if(auth.user){if(k==='done'||k==='step'){const ids=new Set([...Object.keys(st.step),...Object.keys(v)]);ids.forEach(id=>DigitalSaathiData.saveProgress(auth.user.id,id,{step:k==='step'?v[id]:st.step[id],done:k==='done'?v[id]:st.done[id]}))}if(k==='scores'){const changed=Object.keys(v).find(id=>JSON.stringify(v[id])!==JSON.stringify(st.scores[id]));if(changed)DigitalSaathiData.saveScores(auth.user.id,{[changed]:v[changed]})}if(k==='rem')DigitalSaathiData.saveReminder(auth.user.id,v)}};
const setSettings=v=>{setSet(v);if(auth.user)DigitalSaathiData.saveProfile(auth.user.id,v)};
